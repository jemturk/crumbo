<!--
  Shows the OTP code (verified in-app via supabase.auth.verifyOtp, see gate.tsx's
  handleCompletePasswordReset), not a magic link — Supabase's PKCE code exchange requires
  happening in the same client that called resetPasswordForEmail, which is always this app, so a
  link opened in any browser (even on the same phone) can never complete it. A code has no such
  restriction: it's a server-side shared secret, not a client-local code/verifier pairing, so it
  works from wherever the parent reads their email.
-->
<div style="background-color:#FFFDF3;padding:32px 24px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  <div style="max-width:480px;margin:0 auto;background:#FFFFFF;border:2px solid #FFF5D1;border-radius:24px;padding:32px;text-align:center;">
    <div style="font-size:48px;line-height:1;margin-bottom:8px;">🔒</div>
    <h1 style="color:#4E342E;font-size:22px;margin:0 0 12px;">Reset Your Password</h1>
    <p style="color:#8D6E63;font-size:15px;line-height:22px;margin:0 0 24px;">
      We got a request to reset the password for your Crumbo Parent account. Open the Crumbo app, tap "Forgot password?", and enter this code along with your new password:
    </p>
    <div style="display:inline-block;background-color:#FFF5D1;color:#4E342E;font-weight:800;font-size:32px;letter-spacing:6px;padding:16px 28px;border-radius:20px;font-family:monospace;">
      {{ .Token }}
    </div>
    <p style="color:#A1887F;font-size:12px;margin-top:28px;">
      If you didn't request this, you can safely ignore this email — your password won't change.
    </p>
  </div>
</div>
